name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall bot tests
      - name: Ruff
        run: ruff check bot tests
      - name: Tests
        env:
          TELEGRAM_BOT_TOKEN: dummy
          GROQ_API_KEY: dummy
          MEMORY_DB_PATH: /tmp/ci_memory.db
        run: python -m pytest -q
