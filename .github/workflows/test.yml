name: Pre-Deploy Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall bot && echo OK
      - name: Intent + sandbox unit check
        env:
          TELEGRAM_BOT_TOKEN: dummy
          GROQ_API_KEY: dummy
          GOOGLE_DRIVE_FOLDER_ID: dummy
          GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
        run: |
          python -c "
          from bot.domain.intent import parse_intent, Intent
          from bot.infra.sandbox import SandboxStorage
          assert parse_intent('3 download karo').intent == Intent.DRIVE_DOWNLOAD
          assert parse_intent('3 download karo').serial == 3
          assert parse_intent('insta se 2 download').serial == 2
          # Note: Complex intents like DRIVE_RANDOM are now handled by AI Action Tags in handle_text
          assert parse_intent('photo bhej').intent == Intent.CHAT
          assert parse_intent('hello baby').intent == Intent.CHAT
          s = SandboxStorage('/tmp/ci_test')
          s.write_bytes('t.txt', b'ok')
          assert s.exists('t.txt')
          print('OK')
          "
