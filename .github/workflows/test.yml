name: Pre-Deploy Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall bot && echo OK
      - name: Intent router unit check
        run: |
          python -c "
          from bot.domain.intent import parse_intent, Intent
          assert parse_intent('3 download karo').intent == Intent.DRIVE_DOWNLOAD
          assert parse_intent('3 download karo').serial == 3
          assert parse_intent('Map folder list').intent == Intent.DRIVE_LIST
          assert parse_intent('hello baby').intent == Intent.CHAT
          print('intent OK')
          "
