name: Pre-Deploy Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall bot && echo OK
      - name: System + Sandbox unit check
        env:
          TELEGRAM_BOT_TOKEN: dummy
          GROQ_API_KEY: dummy
          GOOGLE_DRIVE_FOLDER_ID: dummy
          GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
        run: |
          python -c "
          import os
          from bot.infra.sandbox import SandboxStorage
          from bot.infra.memory import MemoryStore
          
          # 1. Test Sandbox
          s = SandboxStorage('/tmp/ci_test')
          s.write_bytes('t.txt', b'ok')
          assert s.exists('t.txt'), 'Sandbox storage failed'
          
          # 2. Test Hybrid Memory (SQLite Fallback)
          # This ensures the bot starts even without a Postgres URL
          m = MemoryStore('/tmp/ci_test_memory.db')
          m.set_mood(12345, 'Naughty')
          assert m.get_mood(12345) == 'Naughty', 'Memory storage fallback failed'
          
          # 3. Test Modular Imports
          # This ensures the new gateway structure doesn't have circular imports
          from bot.gateway.handlers import handle_text
          from bot.gateway.media import handle_photo
          from bot.gateway.vault import cmd_vault_add
          
          print('CI Checks Passed: Sandbox, Memory Fallback, and Modular Imports are OK.')
          "
